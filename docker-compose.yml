services:
  datasette:
    build: .
    image: activity-sette:latest
    ports:
      - "8001:8001"
    volumes:
      - ./data:/data
      - ./datasette:/app/datasette:ro
    restart: unless-stopped

  # One-off tool container: docker compose run --rm importer import /activities
  importer:
    image: activity-sette:latest
    profiles: ["tools"]
    entrypoint: ["activity-sette"]
    command: ["import", "/activities"]
    volumes:
      - ./activities:/activities:ro
      - ./data:/data
      - ./config:/app/config:ro
