[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "activity-heat"
version = "0.1.0"
description = "Parse GPX/TCX fitness activities and load them into a Datasette-ready SQLite database"
requires-python = ">=3.11"
dependencies = [
    "sqlite-utils>=3.36",
    "tzdata",
]

[project.optional-dependencies]
timezones = ["timezonefinder>=6.5"]
dev = ["pytest>=8"]

[project.scripts]
activity-heat = "activity_heat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
